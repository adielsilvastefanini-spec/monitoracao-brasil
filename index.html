<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoração - Brasil</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body {
      background-color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      color: #334155;
    }

    .header-banner {
      background: linear-gradient(135deg, #1b0088 0%, #002699 50%, #e2001a 100%);
      color: #ffffff;
      padding: 10px 25px;
      box-shadow: 0 2px 8px rgba(27, 0, 136, 0.2);
      margin-bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title-box h2 {
      margin: 0;
      font-weight: 700;
      font-size: 1.3rem;
      line-height: 1.2;
    }

    .header-title-box p {
      margin: 2px 0 0 0;
      font-size: 0.8rem;
      color: #e0e7ff;
      opacity: 0.9;
    }

    .container-passagem {
      padding: 0 15px 15px 15px;
      width: 100%;
    }

    .card-tabela {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }

    .toolbar-integrada {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      width: 100%;
      gap: 10px;
    }

    .grupo-esquerda-botoes {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .grupo-direita-controles {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-acao-topo {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 5px;
      font-weight: 600;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 26px;
      white-space: nowrap;
    }

    .btn-novo-topo { background-color: #3b82f6 !important; color: #ffffff !important; }
    .btn-add-sitio-topo { background-color: #0284c7 !important; color: #ffffff !important; }
    .btn-salvar-topo { background-color: #10b981 !important; color: #ffffff !important; }
    .btn-excluir-topo { background-color: #ef4444 !important; color: #ffffff !important; }
    .btn-email-topo { background-color: #8b5cf6 !important; color: #ffffff !important; }
    .btn-checkpoint-topo { background-color: #f59e0b !important; color: #ffffff !important; }

    .dataTables_empty {
      display: none !important;
    }

    #incidentes thead tr th,
    table.dataTable thead th,
    .table thead th {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border: none !important;
      text-align: center;
      padding: 8px 4px !important;
      white-space: nowrap;
      vertical-align: middle;
    }

    table.dataTable {
      width: 100% !important;
      font-size: 11px;
      border-collapse: collapse !important;
    }

    table.dataTable tbody td {
      padding: 3px 2px !important;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      border-bottom: 1px solid #f1f5f9;
    }

    .input-tabela-sm, .select-tabela-sm {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 2px;
      font-size: 10.5px;
      height: 24px;
      color: #334155;
    }

    td.sitio-laranja { background-color: #ffaa00 !important; }
    td.sitio-laranja select { background-color: #ffaa00 !important; color: #ffffff !important; font-weight: bold; }

    td.sitio-verde { background-color: #22c55e !important; }
    td.sitio-verde select { background-color: #22c55e !important; color: #ffffff !important; font-weight: bold; }

    td.sitio-cinza { background-color: #6b7280 !important; }
    td.sitio-cinza select { background-color: #6b7280 !important; color: #ffffff !important; font-weight: bold; }

    .select-sitio { width: 75px !important; }
    .select-tipo { width: 100px !important; }
    .select-parceiro { width: 110px !important; }
    .input-data { width: 98px !important; }
    .input-hora { width: 68px !important; }
    .select-falha { width: 105px !important; }
    .select-opcom { width: 65px !important; }
    .select-impacto { width: 60px !important; }
    .select-causa { width: 115px !important; }
    .input-ticket { width: 110px !important; text-align: center; }
    .col-status { width: 100% !important; }
    .input-status { width: 100% !important; min-width: 200px; text-align: left; }
  </style>
</head>
<body>

  <div class="header-banner">
    <div class="header-title-box">
      <h2>Passagem de Turno - Monitoração Brasil</h2>
      <p>Painel de Controle e Registro de Incidentes</p>
    </div>
  </div>

  <div class="container-fluid container-passagem">
    <div class="card-tabela">
      
      <div class="toolbar-integrada">
        <div class="grupo-esquerda-botoes">
          <button class="btn btn-sm btn-acao-topo btn-novo-topo" id="btnNovoItem" type="button">+ Novo</button>
          <button class="btn btn-sm btn-acao-topo btn-add-sitio-topo" id="btnAbrirModalSitio" type="button" data-bs-toggle="modal" data-bs-target="#modalNovoSitio">± Sítio</button>
          <button class="btn btn-sm btn-acao-topo btn-salvar-topo" id="btnSalvarTudo" type="button">Salvar</button>
          <button class="btn btn-sm btn-acao-topo btn-excluir-topo" id="btnExcluirSelecionado" type="button">Excluir</button>
          <button class="btn btn-sm btn-acao-topo btn-email-topo" id="btnEmail" type="button">✉ Email</button>
          <button class="btn btn-sm btn-acao-topo btn-checkpoint-topo" id="btnCheckPoint" type="button">⚑ Check-Point</button>
        </div>
        <div class="grupo-direita-controles">
          <div id="containerSearch">
            <label style="font-size: 11px; color: #64748b;">Buscar: 
              <input type="search" id="inputCustomSearch" class="form-control form-control-sm d-inline-block w-auto" style="height:26px; font-size:11px;">
            </label>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table id="incidentes" class="display table align-middle w-100">
          <thead>
            <tr>
              <th style="width: 25px;"><input type="checkbox" id="checkAll"></th>
              <th>Sítio</th>
              <th>Tipo</th>
              <th>Data - 1</th>
              <th>H.Inicio</th>
              <th>Data - 2</th>
              <th>H.Fim</th>
              <th>Falha</th>
              <th>Opcom</th>
              <th>Impacto</th>
              <th>Parceiros</th>
              <th>Causa</th>
              <th>Ticket</th>
              <th style="width: 100%;">Status</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <div class="modal fade" id="modalNovoSitio" tabindex="-1" aria-labelledby="modalNovoSitioLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white py-2">
          <h5 class="modal-title fs-6" id="modalNovoSitioLabel">Cadastrar / Editar Sítio</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body fs-6">
          <form id="formNovoSitio">
            <div class="mb-3">
              <label for="inputNovoSitio" class="form-label fw-semibold text-secondary mb-1">Código do Sítio (Ex: GIG, SSA):</label>
              <input type="text" class="form-control form-control-sm text-uppercase" id="inputNovoSitio" placeholder="DIGITE O CÓDIGO DO SÍTIO" required>
            </div>
            <div class="mb-3">
              <label for="inputNovoTipo" class="form-label fw-semibold text-secondary mb-1">Tipo de Local (Ex: ATO, Teca, Loja):</label>
              <input type="text" class="form-control form-control-sm" id="inputNovoTipo" placeholder="Digite o Tipo" required>
            </div>
            <div class="mb-3">
              <label for="inputNovosParceiros" class="form-label fw-semibold text-secondary mb-1">Parceiros (Separados por vírgula):</label>
              <input type="text" class="form-control form-control-sm" id="inputNovosParceiros" placeholder="Ex: VIVO, CIRION BRASIL, OI" required>
            </div>
          </form>
        </div>
        <div class="modal-footer py-2">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-sm btn-primary" id="btnSalvarNovoSitio">Salvar Dados</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
